<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memes</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-black text-white min-vh-100 d-flex flex-column align-items-center justify-content-center"
  >
    <div class="container text-center" style="max-width: 600px">
      <h1 class="text-danger fw-bold text-decoration-underline mb-4">
        Enter Number From 0 to 99
      </h1>

      <div class="mb-4">
        <input
          type="number"
          class="form-control bg-danger border-white mx-auto text-white shadow-none"
          style="max-width: 300px"
        />
      </div>
      <div class="mb-5">
        <button
          class="btn btn-danger text-warning fw-bold px-4 py-2"
          type="button"
        >
          Show Meme
        </button>
      </div>

      <div id="result" class="mt-4"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
